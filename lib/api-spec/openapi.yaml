openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Exam Preparation System (EPS) API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: courses
  - name: topics
  - name: questions
  - name: exams
  - name: users
  - name: admin
  - name: programs
  - name: practice
  - name: analytics
  - name: recommendations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Self-register a new student account (pending admin approval)
      description: >
        Always returns a generic acknowledgment regardless of whether the email
        already exists, to avoid account enumeration. New accounts are created
        with status "pending" and require admin approval before they can sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Bad request

  /auth/me/password:
    patch:
      operationId: changeMyPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Updated
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/email:
    patch:
      operationId: changeMyEmail
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email already in use

  /notifications:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: List notifications for the authenticated user (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read (only if it belongs to the caller)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the caller's notifications as read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /messages:
    get:
      operationId: listMyMessages
      tags: [messages]
      summary: List messages for the authenticated user (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /messages/{id}/read:
    patch:
      operationId: markMessageRead
      tags: [messages]
      summary: Mark one message as read (only if it belongs to the caller)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found

  /messages/read-all:
    patch:
      operationId: markAllMessagesRead
      tags: [messages]
      summary: Mark all of the caller's messages as read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/profile-image:
    patch:
      operationId: updateMyProfileImage
      tags: [auth]
      summary: Update or clear current user's profile image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileImageRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/delete:
    post:
      operationId: deleteMyAccount
      tags: [auth]
      summary: Self-service account deletion (students only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account deleted
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List active programs (any authenticated user)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Program" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a new program (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Program code already in use

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses (lecturer/admin) or current user's enrolled courses (student)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course (lecturer/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCourse
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{id}/topics:
    get:
      operationId: listCourseTopics
      tags: [topics]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
    post:
      operationId: createTopic
      tags: [topics]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "403":
          $ref: "#/components/responses/Forbidden"

  /topics/{id}:
    put:
      operationId: updateTopic
      tags: [topics]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTopicRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTopic
      tags: [topics]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/courses:
    get:
      operationId: getUserCourses
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      parameters:
        - in: query
          name: courseId
          schema:
            type: integer
        - in: query
          name: topicId
          schema:
            type: integer
        - in: query
          name: difficulty
          schema:
            $ref: "#/components/schemas/Difficulty"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createQuestion
      tags: [questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "403":
          $ref: "#/components/responses/Forbidden"

  /questions/search:
    get:
      operationId: searchQuestions
      tags: [questions]
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: courseId
          schema:
            type: integer
        - in: query
          name: topicId
          schema:
            type: integer
        - in: query
          name: difficulty
          schema:
            $ref: "#/components/schemas/Difficulty"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"

  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateQuestion
      tags: [questions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "403":
          $ref: "#/components/responses/Forbidden"

  /questions/{id}/archive:
    patch:
      operationId: archiveQuestion
      tags: [questions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "403":
          $ref: "#/components/responses/Forbidden"

  /exams/generate:
    post:
      operationId: generateExam
      tags: [exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamWithQuestions"
        "400":
          $ref: "#/components/responses/BadRequest"

  /exams/{id}:
    get:
      operationId: getExam
      tags: [exams]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamWithQuestions"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams/{id}/start:
    post:
      operationId: startExam
      tags: [exams]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamWithQuestions"

  /exams/{id}/submit:
    post:
      operationId: submitExam
      tags: [exams]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitExamRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"

  /exams/{id}/review:
    get:
      operationId: getExamReview
      tags: [exams]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamReview"

  /users/{id}/exams:
    get:
      operationId: getUserExams
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"

  /practice/generate:
    post:
      operationId: generatePractice
      tags: [practice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionWithQuestions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /practice/history:
    get:
      operationId: getPracticeHistory
      tags: [practice]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeHistory"

  /practice/{sessionId}:
    get:
      operationId: getPracticeSession
      tags: [practice]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionWithQuestions"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/{sessionId}/answer:
    post:
      operationId: submitPracticeAnswer
      tags: [practice]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPracticeAnswerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAnswerFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/{sessionId}/finish:
    post:
      operationId: finishPracticeSession
      tags: [practice]
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/recalculate:
    post:
      operationId: recalculateAnalytics
      tags: [analytics]
      description: Recompute the current student's performance summaries and refresh recommendations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalculateResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/weak-areas:
    get:
      operationId: getWeakAreas
      tags: [analytics]
      description: The current student's weak / needs-practice topics and subtopics.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakArea"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      description: The current student's active recommendations, highest priority first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recommendations/{id}/complete:
    patch:
      operationId: completeRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /recommendations/{id}/dismiss:
    patch:
      operationId: dismissRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /revision-plan:
    get:
      operationId: getRevisionPlan
      tags: [recommendations]
      description: An ordered study plan generated from the current student's active recommendations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPlan"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/student/analytics:
    get:
      operationId: getStudentDashboardAnalytics
      tags: [analytics]
      description: Compact analytics summary for the authenticated student's dashboard.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboardAnalytics"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/student/topic-performance:
    get:
      operationId: getStudentTopicPerformance
      tags: [analytics]
      description: The authenticated student's per-topic/subtopic performance, weakest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicPerformance"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/student/progress-over-time:
    get:
      operationId: getStudentProgressOverTime
      tags: [analytics]
      description: Chronological list of the authenticated student's submitted exams and completed practice sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressPoint"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/student/readiness-score:
    get:
      operationId: getStudentReadinessScore
      tags: [analytics]
      description: The authenticated student's exam-readiness score, label and short explanation.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessScore"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/lecturer/analytics:
    get:
      operationId: getLecturerDashboardAnalytics
      tags: [analytics]
      description: Aggregated analytics for the courses the authenticated lecturer teaches. No individual student data.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LecturerDashboardAnalytics"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/lecturer/course/{courseId}/analytics:
    get:
      operationId: getLecturerCourseAnalytics
      tags: [analytics]
      description: Aggregated analytics for a single course the lecturer teaches. 403 if the lecturer does not teach it.
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LecturerCourseAnalytics"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/lecturer/problematic-questions:
    get:
      operationId: getLecturerProblematicQuestions
      tags: [analytics]
      description: Questions in the lecturer's courses with high failure rates (attempts >= 5 and incorrect rate >= 70%).
      parameters:
        - in: query
          name: courseId
          required: false
          schema:
            type: integer
          description: Optional filter to a single course the lecturer teaches.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblematicQuestion"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      parameters:
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad Request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use

  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{id}/members:
    get:
      operationId: listCourseMembers
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addCourseMember
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCourseMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already a member

  /courses/{id}/members/{userId}:
    delete:
      operationId: removeCourseMember
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/deletion-requests:
    get:
      operationId: listDeletionRequests
      tags: [admin]
      summary: All account deletion requests (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletionRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: System overview totals (users, courses, topics, questions, exams)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
    SessionIdPath:
      in: path
      name: sessionId
      required: true
      schema:
        type: integer
    CourseIdPath:
      in: path
      name: courseId
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Role:
      type: string
      enum: [student, lecturer, admin]

    Difficulty:
      type: string
      enum: [Easy, Medium, Hard]

    QuestionStatus:
      type: string
      enum: [draft, pending, approved, archived]

    QuestionType:
      type: string
      enum: [single_choice, multiple_choice]

    ExamStatus:
      type: string
      enum: [generated, in_progress, submitted]

    User:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        accountStatus: { type: string }
        profileImageUrl: { type: string, nullable: true }
        programId: { type: integer, nullable: true, description: "Student's program (null for admins/lecturers)" }
        programName: { type: string, nullable: true }
        programCode: { type: string, nullable: true }
        programIds:
          type: array
          description: "Programs a lecturer teaches in (only populated for lecturers)"
          items: { type: integer }
        currentStudyYear:
          type: string
          nullable: true
          enum: [First, Second, Third, Fourth, null]
          description: "Student's current year of study"
        currentSemester:
          type: string
          nullable: true
          enum: [A, B, null]
          description: "Student's current semester"
        mustChangePassword:
          type: boolean
          description: "True when the user has a system-assigned temporary password and must change it before using the app"
      required: [id, fullName, email, role, accountStatus]

    Program:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        status: { type: string }
      required: [id, name, code, status]

    CreateProgramRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        status: { type: string }
      required: [name, code]

    CreateUserRequest:
      type: object
      properties:
        fullName: { type: string }
        email: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        accountStatus: { type: string }
        programId:
          type: integer
          nullable: true
          description: "For role=student: the program they study in"
        programIds:
          type: array
          description: "For role=lecturer: programs they teach in"
          items: { type: integer }
        currentStudyYear:
          type: string
          nullable: true
          enum: [First, Second, Third, Fourth, null]
          description: "For role=student: current year of study"
        currentSemester:
          type: string
          nullable: true
          enum: [A, B, null]
          description: "For role=student: current semester"
      required: [fullName, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        accountStatus: { type: string }

    AddCourseMemberRequest:
      type: object
      properties:
        userId: { type: integer }
      required: [userId]

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        relatedEntityType: { type: string, nullable: true }
        relatedEntityId: { type: integer, nullable: true }
        status: { type: string, enum: [unread, read] }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
      required: [id, type, title, message, status, createdAt]

    Message:
      type: object
      properties:
        id: { type: integer }
        senderId: { type: integer, nullable: true }
        senderName: { type: string, nullable: true }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [unread, read] }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
      required: [id, subject, body, status, createdAt]

    MarkAllReadResponse:
      type: object
      properties:
        updated: { type: integer }
      required: [updated]

    UpdateProfileImageRequest:
      type: object
      properties:
        imageDataUrl:
          type: string
          nullable: true
          description: Data URL (data:image/...;base64,...) up to ~2MB; null to remove the current image
      required: [imageDataUrl]

    DeleteAccountRequest:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1 }
        reason: { type: string, minLength: 5, maxLength: 1000 }
        confirm: { type: boolean, enum: [true] }
      required: [currentPassword, reason, confirm]

    DeletionRequest:
      type: object
      properties:
        id: { type: integer }
        formerUserId: { type: integer }
        formerEmail: { type: string }
        formerFullName: { type: string }
        formerRole: { $ref: "#/components/schemas/Role" }
        reason: { type: string }
        deletedAt: { type: string, format: date-time }
      required: [id, formerUserId, formerEmail, formerFullName, formerRole, reason, deletedAt]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 6 }
      required: [currentPassword, newPassword]

    ChangeEmailRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newEmail: { type: string, format: email }
      required: [currentPassword, newEmail]

    LoginRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        programId:
          type: integer
          description: "Program/track the student is enrolling in"
        currentStudyYear:
          type: string
          enum: [First, Second, Third, Fourth]
          description: "Student's current year of study"
        currentSemester:
          type: string
          enum: [A, B]
          description: "Student's current semester"
      required: [fullName, email, password, programId, currentStudyYear, currentSemester]

    RegisterResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]

    AuthLoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
      required: [token, user]

    Course:
      type: object
      properties:
        id: { type: integer }
        courseCode: { type: string }
        courseName: { type: string }
        semester: { type: string, nullable: true }
        academicYear: { type: string, nullable: true }
        status: { type: string }
        offeringId: { type: integer, nullable: true, description: "Set when row represents a specific course offering" }
        programId: { type: integer, nullable: true }
        programName: { type: string, nullable: true }
        programCode: { type: string, nullable: true }
        lecturerId: { type: integer, nullable: true }
        lecturerName: { type: string, nullable: true }
        approvedQuestionCount: { type: integer, description: "Number of approved questions in this course (server-aggregated)" }
        pendingQuestionCount: { type: integer, description: "Number of pending/draft questions in this course visible to the caller" }
        studyYear:
          type: string
          nullable: true
          enum: [First, Second, Third, Fourth, null]
          description: "Study year of the matched offering"
        offeringSemester:
          type: string
          nullable: true
          enum: [A, B, null]
          description: "Semester of the matched offering (A/B)"
      required: [id, courseCode, courseName, status]

    CreateCourseRequest:
      type: object
      properties:
        courseCode: { type: string }
        courseName: { type: string }
        semester: { type: string, nullable: true }
        academicYear: { type: string, nullable: true }
        programId:
          type: integer
          description: "Program/track this offering belongs to"
        lecturerId:
          type: integer
          nullable: true
          description: "Lecturer teaching this offering. Defaults to the caller when they are a lecturer."
      required: [courseCode, courseName, programId]

    UpdateCourseRequest:
      type: object
      properties:
        courseCode: { type: string }
        courseName: { type: string }
        semester: { type: string, nullable: true }
        academicYear: { type: string, nullable: true }
        status: { type: string }

    Topic:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        topicName: { type: string }
        parentTopicId: { type: integer, nullable: true }
        weight: { type: number, nullable: true }
        status: { type: string }
      required: [id, courseId, topicName, status]

    CreateTopicRequest:
      type: object
      properties:
        topicName: { type: string }
        parentTopicId: { type: integer, nullable: true }
        weight: { type: number, nullable: true }
      required: [topicName]

    UpdateTopicRequest:
      type: object
      properties:
        topicName: { type: string }
        parentTopicId: { type: integer, nullable: true }
        weight: { type: number, nullable: true }
        status: { type: string }

    AnswerOption:
      type: object
      properties:
        id: { type: integer }
        questionId: { type: integer }
        answerText: { type: string }
        isCorrect: { type: boolean }
        displayOrder: { type: integer }
      required: [id, questionId, answerText, isCorrect, displayOrder]

    AnswerOptionInput:
      type: object
      properties:
        answerText: { type: string }
        isCorrect: { type: boolean }
      required: [answerText, isCorrect]

    Question:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        topicId: { type: integer, nullable: true }
        subtopicId: { type: integer, nullable: true }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        explanationText: { type: string, nullable: true }
        sourceReference: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/QuestionStatus" }
        createdBy: { type: integer, nullable: true }
        options:
          type: array
          items: { $ref: "#/components/schemas/AnswerOption" }
        courseName: { type: string, nullable: true }
        topicName: { type: string, nullable: true }
      required:
        [id, courseId, title, questionText, questionType, difficultyLevel, status, options]

    CreateQuestionRequest:
      type: object
      properties:
        courseId: { type: integer }
        topicId: { type: integer, nullable: true }
        subtopicId: { type: integer, nullable: true }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        explanationText: { type: string, nullable: true }
        sourceReference: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/QuestionStatus" }
        options:
          type: array
          items: { $ref: "#/components/schemas/AnswerOptionInput" }
          minItems: 2
      required:
        [courseId, title, questionText, questionType, difficultyLevel, options]

    UpdateQuestionRequest:
      type: object
      properties:
        courseId: { type: integer }
        topicId: { type: integer, nullable: true }
        subtopicId: { type: integer, nullable: true }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        explanationText: { type: string, nullable: true }
        sourceReference: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/QuestionStatus" }
        options:
          type: array
          items: { $ref: "#/components/schemas/AnswerOptionInput" }

    GenerateExamRequest:
      type: object
      properties:
        courseId: { type: integer }
        topicIds:
          type: array
          items: { type: integer }
        totalQuestions:
          type: integer
          minimum: 5
          maximum: 100
          description: "Number of questions. Minimum 5."
        difficultyLevel:
          allOf:
            - $ref: "#/components/schemas/Difficulty"
          nullable: true
          description: "If set, only questions of this difficulty are included. Omit/null for a mix of all difficulties."
        durationMinutes: { type: integer, nullable: true }
      required: [courseId, totalQuestions]

    ExamQuestionOption:
      type: object
      properties:
        id: { type: integer }
        answerText: { type: string }
      required: [id, answerText]

    ExamQuestion:
      type: object
      properties:
        id: { type: integer }
        questionId: { type: integer }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        topicName: { type: string, nullable: true }
        randomizedOrder: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/ExamQuestionOption" }
        selectedAnswerOptionId:
          type: integer
          nullable: true
          description: "Legacy single-choice selection (kept for backward compat). For multi-select use selectedAnswerOptionIds."
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
          description: "All option ids currently selected by the student for this question."
        maxScore:
          type: number
          description: "Max points this question is worth (snapshotted from difficulty at exam generation time)."
      required:
        [id, questionId, title, questionText, questionType, difficultyLevel, randomizedOrder, options, selectedAnswerOptionIds, maxScore]

    Exam:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        courseId: { type: integer }
        courseName: { type: string, nullable: true }
        examMode: { type: string }
        totalQuestions: { type: integer }
        durationMinutes: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        score: { type: number, nullable: true, description: "Final percentage (0-100)." }
        totalMaxScore: { type: number, description: "Sum of maxScore across all exam questions." }
        totalEarnedScore: { type: number, nullable: true, description: "Sum of earnedScore across all exam questions (null until submitted)." }
        status: { $ref: "#/components/schemas/ExamStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, userId, courseId, examMode, totalQuestions, status, createdAt, totalMaxScore]

    ExamWithQuestions:
      allOf:
        - $ref: "#/components/schemas/Exam"
        - type: object
          properties:
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamQuestion" }
          required: [questions]

    SubmitAnswer:
      type: object
      properties:
        examQuestionId: { type: integer }
        selectedAnswerOptionId:
          type: integer
          nullable: true
          description: "Legacy single-choice selection. Use selectedAnswerOptionIds for multi-select; this is kept for backward compatibility."
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
          description: "All option ids the student selected for this question. Empty array means unanswered."
      required: [examQuestionId]

    SubmitExamRequest:
      type: object
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/SubmitAnswer" }
      required: [answers]

    ExamResult:
      type: object
      properties:
        examId: { type: integer }
        score: { type: number, description: "Final percentage (0-100)." }
        correctCount: { type: integer, description: "Number of questions answered fully correctly." }
        totalQuestions: { type: integer }
        totalMaxScore: { type: number }
        totalEarnedScore: { type: number }
        status: { $ref: "#/components/schemas/ExamStatus" }
      required: [examId, score, correctCount, totalQuestions, status, totalMaxScore, totalEarnedScore]

    ReviewItem:
      type: object
      properties:
        examQuestionId: { type: integer }
        questionId: { type: integer }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        topicName: { type: string, nullable: true }
        explanationText: { type: string, nullable: true }
        isCorrect: { type: boolean, description: "True only if earnedScore equals maxScore." }
        maxScore: { type: number }
        earnedScore: { type: number, nullable: true, description: "Points earned for this question; null if not yet graded." }
        totalCorrectCount: { type: integer, description: "How many of the question's options are correct." }
        correctSelectedCount: { type: integer, description: "How many correct options the student selected." }
        incorrectSelectedCount: { type: integer, description: "How many incorrect options the student selected." }
        selectedAnswerOptionId: { type: integer, nullable: true, description: "Legacy single-choice selection." }
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
        correctAnswerOptionId: { type: integer, nullable: true, description: "Legacy single correct option (first correct)." }
        correctAnswerOptionIds:
          type: array
          items: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/AnswerOption" }
      required:
        [examQuestionId, questionId, title, questionText, questionType, difficultyLevel, isCorrect, maxScore, totalCorrectCount, correctSelectedCount, incorrectSelectedCount, selectedAnswerOptionIds, correctAnswerOptionIds, options]

    ExamReview:
      type: object
      properties:
        exam: { $ref: "#/components/schemas/Exam" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }
      required: [exam, items]

    ConfidenceLevel:
      type: string
      enum: [low, medium, high]

    PracticeSessionType:
      type: string
      enum: [topic, subtopic, mixed, mistakes, weak_area]

    PracticeSessionStatus:
      type: string
      enum: [active, completed, abandoned]

    PracticeQuestionStatus:
      type: string
      enum: [not_answered, answered]

    GeneratePracticeRequest:
      type: object
      properties:
        courseId: { type: integer }
        topicId: { type: ["integer", "null"], description: "Optional top-level topic to focus on." }
        subtopicId: { type: ["integer", "null"], description: "Optional subtopic to focus on (must be a child of topicId)." }
        questionCount:
          type: integer
          minimum: 1
          maximum: 50
          description: "Number of questions to practice. Defaults to 10 if omitted."
        sessionType:
          allOf:
            - $ref: "#/components/schemas/PracticeSessionType"
          nullable: true
          description: "How the pool is chosen. Defaults to topic/subtopic/mixed based on the filters provided."
      required: [courseId]

    PracticeQuestionOption:
      type: object
      properties:
        id: { type: integer }
        answerText: { type: string }
      required: [id, answerText]

    PracticeQuestion:
      type: object
      properties:
        id: { type: integer, description: "practice_session_questions row id." }
        questionId: { type: integer }
        title: { type: string }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        topicName: { type: ["string", "null"] }
        questionOrder: { type: integer }
        maxScore: { type: number, description: "Points this question is worth (Easy=1, Medium=2, Hard=3)." }
        options:
          type: array
          items: { $ref: "#/components/schemas/PracticeQuestionOption" }
        status: { $ref: "#/components/schemas/PracticeQuestionStatus" }
        selectedAnswerOptionId: { type: ["integer", "null"] }
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
        confidenceLevel:
          allOf:
            - $ref: "#/components/schemas/ConfidenceLevel"
          nullable: true
        isCorrect: { type: ["boolean", "null"] }
        earnedScore: { type: ["number", "null"] }
        responseTimeSeconds: { type: ["integer", "null"] }
        explanationText:
          type: ["string", "null"]
          description: "Only populated once the question has been answered."
        correctAnswerOptionIds:
          type: array
          items: { type: integer }
          description: "Correct option ids. Empty until the question has been answered (avoids leaking answers early)."
      required:
        [id, questionId, title, questionText, questionType, difficultyLevel, questionOrder, maxScore, options, status, selectedAnswerOptionIds, correctAnswerOptionIds]

    PracticeSession:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: ["integer", "null"] }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        sessionType: { $ref: "#/components/schemas/PracticeSessionType" }
        status: { $ref: "#/components/schemas/PracticeSessionStatus" }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        correctCount: { type: integer }
        earnedScore: { type: number }
        totalMaxScore: { type: number }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        [id, userId, courseId, sessionType, status, totalQuestions, answeredCount, correctCount, earnedScore, totalMaxScore, startedAt, createdAt]

    PracticeSessionWithQuestions:
      allOf:
        - $ref: "#/components/schemas/PracticeSession"
        - type: object
          properties:
            questions:
              type: array
              items: { $ref: "#/components/schemas/PracticeQuestion" }
          required: [questions]

    SubmitPracticeAnswerRequest:
      type: object
      properties:
        practiceQuestionId: { type: integer, description: "practice_session_questions row id." }
        selectedAnswerOptionId: { type: ["integer", "null"], description: "Legacy single-choice selection." }
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
          description: "All option ids the student selected. Empty array means unanswered."
        confidenceLevel:
          allOf:
            - $ref: "#/components/schemas/ConfidenceLevel"
          nullable: true
        responseTimeSeconds: { type: ["integer", "null"] }
      required: [practiceQuestionId]

    PracticeAnswerFeedback:
      type: object
      properties:
        practiceQuestionId: { type: integer }
        questionId: { type: integer }
        isCorrect: { type: boolean }
        maxScore: { type: number }
        earnedScore: { type: number }
        correctAnswerOptionIds:
          type: array
          items: { type: integer }
        selectedAnswerOptionIds:
          type: array
          items: { type: integer }
        explanationText: { type: ["string", "null"] }
        answeredCount: { type: integer, description: "Running count of answered questions in this session." }
        correctCount: { type: integer, description: "Running count of fully-correct questions in this session." }
      required:
        [practiceQuestionId, questionId, isCorrect, maxScore, earnedScore, correctAnswerOptionIds, selectedAnswerOptionIds, answeredCount, correctCount]

    PracticeSummary:
      type: object
      properties:
        sessionId: { type: integer }
        status: { $ref: "#/components/schemas/PracticeSessionStatus" }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        correctCount: { type: integer }
        incorrectCount: { type: integer }
        earnedScore: { type: number }
        totalMaxScore: { type: number }
        accuracyPercentage: { type: number, description: "correctCount / answeredCount * 100 (0 if none answered)." }
        lowConfidenceCount: { type: integer, description: "Answered questions the student marked low confidence." }
      required:
        [sessionId, status, totalQuestions, answeredCount, correctCount, incorrectCount, earnedScore, totalMaxScore, accuracyPercentage, lowConfidenceCount]

    PracticeHistory:
      type: object
      properties:
        active:
          type: array
          items: { $ref: "#/components/schemas/PracticeSession" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/PracticeSession" }
      required: [active, completed]

    AdminOverview:
      type: object
      properties:
        totals:
          type: object
          properties:
            users: { type: integer }
            students: { type: integer }
            lecturers: { type: integer }
            admins: { type: integer }
            courses: { type: integer }
            topics: { type: integer }
            questions: { type: integer }
            approvedQuestions: { type: integer }
            archivedQuestions: { type: integer }
            exams: { type: integer }
            submittedExams: { type: integer }
          required:
            [users, students, lecturers, admins, courses, topics, questions, approvedQuestions, archivedQuestions, exams, submittedExams]
      required: [totals]

    WeaknessLevel:
      type: string
      enum: [strong, needs_practice, weak]

    RecommendationPriority:
      type: string
      enum: [high, medium, low]

    RecommendationType:
      type: string
      enum: [practice_topic, retry_mistakes, review_subtopic, revision_plan_item]

    RecommendationStatus:
      type: string
      enum: [active, completed, dismissed]

    RecommendationSource:
      type: string
      enum: [performance_summary, mock_exam, practice]

    RecalculateResult:
      type: object
      properties:
        summariesUpdated: { type: integer, description: "Number of performance_summary rows rebuilt." }
        weakAreasCount: { type: integer, description: "Topics/subtopics flagged weak or needs_practice." }
        recommendationsCount: { type: integer, description: "Active recommendations after the refresh." }
      required: [summariesUpdated, weakAreasCount, recommendationsCount]

    WeakArea:
      type: object
      properties:
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: integer }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        accuracyRate: { type: number, description: "0-100." }
        attemptsCount: { type: integer }
        correctCount: { type: integer }
        incorrectCount: { type: integer }
        repeatedMistakeCount: { type: integer }
        weaknessScore: { type: number, description: "0-100, higher = weaker." }
        weaknessLevel: { $ref: "#/components/schemas/WeaknessLevel" }
        priority: { $ref: "#/components/schemas/RecommendationPriority" }
      required:
        [courseId, topicId, accuracyRate, attemptsCount, correctCount, incorrectCount, repeatedMistakeCount, weaknessScore, weaknessLevel, priority]

    Recommendation:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: ["integer", "null"] }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        recommendationType: { $ref: "#/components/schemas/RecommendationType" }
        recommendationText: { type: string }
        priority: { $ref: "#/components/schemas/RecommendationPriority" }
        status: { $ref: "#/components/schemas/RecommendationStatus" }
        source: { $ref: "#/components/schemas/RecommendationSource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, userId, courseId, recommendationType, recommendationText, priority, status, source, createdAt, updatedAt]

    RevisionPlanItem:
      type: object
      properties:
        order: { type: integer }
        title: { type: string }
        reason: { type: string }
        priority: { $ref: "#/components/schemas/RecommendationPriority" }
        recommendationId: { type: ["integer", "null"] }
        recommendationType: { $ref: "#/components/schemas/RecommendationType" }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: ["integer", "null"] }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        suggestedQuestionCount: { type: integer }
      required:
        [order, title, reason, priority, recommendationType, courseId, suggestedQuestionCount]

    RevisionPlan:
      type: object
      properties:
        hasEnoughData: { type: boolean }
        message: { type: ["string", "null"], description: "Empty-state message when hasEnoughData is false." }
        items:
          type: array
          items: { $ref: "#/components/schemas/RevisionPlanItem" }
      required: [hasEnoughData, items]

    # --- Sprint 3 Module 3: Dashboards & Analytics ---
    ActivityType:
      type: string
      enum: [mock_exam, practice]

    TopicPerformance:
      type: object
      properties:
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: integer }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        accuracyRate: { type: number, description: "0-100." }
        weaknessLevel: { $ref: "#/components/schemas/WeaknessLevel" }
        weaknessScore: { type: number, description: "0-100, higher = weaker." }
        attemptsCount: { type: integer }
        priority: { $ref: "#/components/schemas/RecommendationPriority" }
      required: [courseId, topicId, accuracyRate, weaknessLevel, weaknessScore, attemptsCount, priority]

    RecentScore:
      type: object
      properties:
        type: { $ref: "#/components/schemas/ActivityType" }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        score: { type: number, description: "0-100." }
        date: { type: ["string", "null"], format: date-time }
      required: [type, courseId, score]

    ProgressPoint:
      type: object
      properties:
        date: { type: ["string", "null"], format: date-time }
        type: { $ref: "#/components/schemas/ActivityType" }
        label: { type: string }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        score: { type: number, description: "0-100." }
        earnedScore: { type: ["number", "null"] }
        maxScore: { type: ["number", "null"] }
      required: [type, label, courseId, score]

    ReadinessScore:
      type: object
      properties:
        readinessScore: { type: ["number", "null"], description: "0-100, or null when there is not enough data." }
        readinessLabel: { type: string }
        message: { type: ["string", "null"], description: "Short, student-friendly explanation." }
      required: [readinessLabel]

    StudentDashboardAnalytics:
      type: object
      properties:
        averageScore: { type: ["number", "null"], description: "0-100 across submitted exams and completed practice; null when none." }
        recentScores:
          type: array
          items: { $ref: "#/components/schemas/RecentScore" }
        topicPerformance:
          type: array
          items: { $ref: "#/components/schemas/TopicPerformance" }
        weakAreasCount: { type: integer }
        strongAreasCount: { type: integer }
        activeRecommendationsCount: { type: integer }
        readinessScore: { type: ["number", "null"] }
        readinessLabel: { type: string }
        readinessMessage: { type: ["string", "null"] }
        practiceSessionsCount: { type: integer, description: "Completed practice sessions." }
        recentPracticeAccuracy: { type: ["number", "null"], description: "Accuracy of the most recent completed practice session, 0-100." }
        progressTrend:
          type: array
          items: { $ref: "#/components/schemas/ProgressPoint" }
      required:
        [recentScores, topicPerformance, weakAreasCount, strongAreasCount, activeRecommendationsCount, readinessLabel, practiceSessionsCount, progressTrend]

    ProblematicQuestion:
      type: object
      properties:
        questionId: { type: integer }
        questionPreview: { type: string }
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: ["integer", "null"] }
        topicName: { type: ["string", "null"] }
        subtopicId: { type: ["integer", "null"] }
        subtopicName: { type: ["string", "null"] }
        difficultyLevel: { $ref: "#/components/schemas/Difficulty" }
        attemptsCount: { type: integer }
        incorrectRate: { type: number, description: "0-100." }
        status: { $ref: "#/components/schemas/QuestionStatus" }
      required: [questionId, questionPreview, courseId, attemptsCount, incorrectRate, status]

    FailedTopic:
      type: object
      properties:
        courseId: { type: integer }
        courseName: { type: ["string", "null"] }
        topicId: { type: integer }
        topicName: { type: ["string", "null"] }
        averageAccuracy: { type: number, description: "0-100 across enrolled students." }
        attemptsCount: { type: integer }
      required: [courseId, topicId, averageAccuracy, attemptsCount]

    LecturerCourseSummary:
      type: object
      properties:
        courseId: { type: integer }
        courseCode: { type: ["string", "null"] }
        courseName: { type: string }
        programName: { type: ["string", "null"] }
        studentsCount: { type: integer }
        averageScore: { type: ["number", "null"] }
        weakTopicsCount: { type: integer }
        problematicQuestionsCount: { type: integer }
      required: [courseId, courseName, studentsCount, weakTopicsCount, problematicQuestionsCount]

    LecturerDashboardAnalytics:
      type: object
      properties:
        coursesCount: { type: integer }
        studentsCount: { type: integer }
        averageClassScore: { type: ["number", "null"] }
        problematicQuestionsCount: { type: integer }
        activeCourses:
          type: array
          items: { $ref: "#/components/schemas/LecturerCourseSummary" }
        mostFailedTopics:
          type: array
          items: { $ref: "#/components/schemas/FailedTopic" }
        mostFailedQuestions:
          type: array
          items: { $ref: "#/components/schemas/ProblematicQuestion" }
      required:
        [coursesCount, studentsCount, problematicQuestionsCount, activeCourses, mostFailedTopics, mostFailedQuestions]

    ClassTopicPerformance:
      type: object
      properties:
        topicId: { type: integer }
        topicName: { type: ["string", "null"] }
        averageAccuracy: { type: number, description: "0-100 across enrolled students." }
        attemptsCount: { type: integer }
        weakStudentsCount: { type: integer, description: "Aggregate count of enrolled students below the accuracy threshold on this topic." }
      required: [topicId, averageAccuracy, attemptsCount, weakStudentsCount]

    ContentGap:
      type: object
      properties:
        topicId: { type: ["integer", "null"] }
        topicName: { type: ["string", "null"] }
        description: { type: string }
      required: [description]

    LecturerCourseAnalytics:
      type: object
      properties:
        courseId: { type: integer }
        courseName: { type: string }
        averageScore: { type: ["number", "null"] }
        studentsCount: { type: integer }
        topicPerformance:
          type: array
          items: { $ref: "#/components/schemas/ClassTopicPerformance" }
        mostFailedQuestions:
          type: array
          items: { $ref: "#/components/schemas/ProblematicQuestion" }
        problematicQuestions:
          type: array
          items: { $ref: "#/components/schemas/ProblematicQuestion" }
        contentGaps:
          type: array
          items: { $ref: "#/components/schemas/ContentGap" }
      required: [courseId, courseName, studentsCount, topicPerformance, mostFailedQuestions, problematicQuestions, contentGaps]
